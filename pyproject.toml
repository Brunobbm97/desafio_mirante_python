[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vendas-cli"
version = "0.1.0"
description = "Gerador de Relatório de Vendas Avançado"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
vendas-cli = "vendas_cli.cli:main"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=vendas_cli"
testpaths = ["tests"]